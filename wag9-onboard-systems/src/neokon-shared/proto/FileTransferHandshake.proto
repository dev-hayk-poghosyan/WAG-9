syntax = "proto3";
package proto;

import "FileTransferType.proto";

message FileTransferHandshake
{
    /**
     * Transfer session uuid.
     * 16 bytes, without hex encoding.
     */
    bytes transfer_uuid_bytes = 1;

    string file_name = 2;

    int64 size_bytes = 3;

    FileTransferType.Type type = 4;
}

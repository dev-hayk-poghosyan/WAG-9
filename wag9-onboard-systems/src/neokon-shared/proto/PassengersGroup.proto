syntax = "proto3";
package proto;

import "PassengersGroupRecord.proto";

/**
 * Used to load configuration from PassengerTypesRatio.json.
 * @see http://git.neokon.local:22580/root/GlobalTerrainEditor-release/-/wikis/%D0%9A%D0%BE%D0%BD%D1%84%D0%B8%D0%B3%D1%83%D1%80%D0%B0%D1%86%D0%B8%D1%8F-%D1%82%D0%B8%D0%BF%D0%BE%D0%B2-%D0%BF%D0%B0%D1%81%D1%81%D0%B0%D0%B6%D0%B8%D1%80%D0%BE%D0%B2
 * Describes passenger group member.
 */
message PassengersGroup
{
    string name = 1;
    repeated PassengersGroupRecord content = 2;
}

syntax = "proto3";
package proto.wag9.fs;

enum Selector152 {
    SELECTOR_152_O = 0;
    SELECTOR_152_I = 1;
}

enum Selector154 {
    SELECTOR_154_NORM = 0;
    SELECTOR_154_I = 1;
    SELECTOR_154_I_PLUS_II = 2;
    SELECTOR_154_II = 3;
}

enum Selector160 {
    SELECTOR_160_I = 0;
    SELECTOR_160_O = 1;
}

enum Selector237 {
    SELECTOR_237_I = 0;
    SELECTOR_237_O = 1;
}

enum TrainMode {
    TRAIN_MODE_GOODS = 0;
    TRAIN_MODE_PASSENGER = 1;
}

message Sb1 {
    Selector152 sb1_failure_mode_operation = 1;
    Selector154 sb1_bogie_cut_out = 2;
    Selector160 sb1_configuration_switch = 3;
    Selector237 sb1_vigilance_device_cut_off = 4;
    bool sb1_simulation = 5;
    bool sb1_configuration_button = 6;
    bool sb1_drivers_cab = 7;
    bool sb1_panto_vcb_control = 8;
    bool sb1_24v_48v_power_supply = 9;
    bool sb1_lighting_front = 10;
    bool sb1_electronics_traction_converter_1 = 11;
    bool sb1_power_supply_gate_units = 12;
    bool sb1_monitoring = 13;
    bool sb1_electronics_aux_converter_1 = 14;
    bool sb1_central_electronics_1 = 15;
    bool sb1_central_electronics_2 = 16;
    bool sb1_speed_sensor = 17;
    reserved 18, 21;
    reserved "sb1_relay_control_electronics_off", "sb1_relay_time_delay_vcb";
    uint32 sb1_power_supply_cab_contactor = 19;
    uint32 sb1_auxiliary_contactor_vcb = 20;
}

message Hb1 {
    bool hb1_transformer_oil_pump = 1;
    bool hb1_converter_oil_pump = 2;
    bool hb1_main_compressor = 3;
    bool hb1_traction_motor_blower = 4;
    bool hb1_scavenge_blower_tm = 5;
    bool hb1_vent_oil_cooler = 6;
    bool hb1_mrb1 = 7;
    bool hb1_scavenge_blower_mr = 8;
    bool hb1_cab_ventilation = 9;
    bool hb1_cab_heater = 10;
    bool hb1_crew_fan = 11;
}

message Sb2 {
    bool sb2_auxiliary_compressor = 1;
    bool sb2_drivers_cab = 2;
    bool sb2_lighting_machine_room = 3;
    bool sb2_power_supply_gate_units = 4;
    bool sb2_commissioning_1 = 5;
    bool sb2_vigilance_control = 6;
    bool sb2_pneumatic_panel = 7;
    bool sb2_commissioning_2 = 8;
    bool sb2_24v_48v_power_supply = 9;
    bool sb2_marker_lights = 10;
    bool sb2_lighting_front = 11;
    bool sb2_electronics_traction_converter_2 = 12;
    bool sb2_monitoring = 13;
    bool sb2_electronics_aux_converter_2 = 14;
    bool sb2_electronics_aux_converter_3 = 15;
    bool sb2_central_electronics_2 = 16;
    bool sb2_central_electronics_3 = 17;
    bool sb2_memotel_speedometer = 18;
    bool sb2_aux_contactor = 19;
    bool sb2_power_supply_air_dryer = 20;
    bool sb2_mcb_for_air_dryer = 21;
    bool sb2_output_battery_charger = 22;
    bool sb2_control_circuit_locomotive = 23;
}

message Hb2 {
    bool hb2_transformer_oil_pump = 1;
    bool hb2_converter_oil_pump = 2;
    bool hb2_main_compressor = 3;
    bool hb2_traction_motor_blower = 4;
    bool hb2_scavenge_blower_tm = 5;
    bool hb2_vent_oil_cooler = 6;
    bool hb2_m_c_room_blower = 7;
    bool hb2_scavenge_blower_mr = 8;
    bool hb2_circuit_breaker_for_cab_ac = 9;
}

// Pneumatic panel cocks and keys: true = ON / open.
// pan_sel_sw is the selector position index; pass_goods and gp are TrainMode.
message PneumoCCB {
    bool ec_coc = 1;
    bool tc2_coc = 2;
    bool tc1_coc = 3;
    bool sifa_coc = 4;
    bool fp_coc = 5;
    bool sand1_coc = 6;
    bool sand2_coc = 7;
    bool ul_coc = 8;
    bool cb_coc = 9;
    bool pans_coc = 10;
    bool pan1_coc = 11;
    bool pan2_coc = 12;
    int32 pan_sel_sw = 13;
    TrainMode pass_goods = 14;
    bool per_coc = 15;
    bool dead_engine = 16;
    TrainMode gp = 17;
}

message PneumoE70 {
    reserved 1, 2, 3;
    reserved "processor_fault", "system_fault", "psu_normal";
    int32 pan_sel_sw = 4;
    bool emergency_cock = 5;
    bool brake_pipe_cock = 6;
    bool pan1 = 7;
    bool pan2 = 8;
    bool vcb = 9;
    bool pantog = 10;
    bool brake_feed_pipe = 11;
    bool dead_engine = 12;
    bool sand_1 = 13;
    bool sand_2 = 14;
}

message FaultStationOutgoingMessage {
    reserved 1, 2;
    reserved "pantograph_1_raised", "pantograph_2_raised";
    optional PneumoCCB pneumo_ccb = 3;
    optional PneumoE70 pneumo_e70 = 4;
    Sb1 sb1 = 5;
    Hb1 hb1 = 6;
    Sb2 sb2 = 7;
    Hb2 hb2 = 8;
}

message FaultStationIncomingMessage
{
    optional double ccb_manometer_pressure = 1;
    optional double e70_manometer_pressure = 2;
    optional bool e70_processor_fault = 3;
    optional bool e70_system_fault = 4;
    optional bool e70_psu_normal = 5;
    optional bool pantograph_1_raised = 6;
    optional bool pantograph_2_raised = 7;
    optional bool sb1_relay_control_electronics_off_tripped = 8;
    optional bool sb1_relay_time_delay_vcb_tripped = 9;
    optional bool sb1_power_supply_cab_contactor_closed = 10;
    optional bool sb1_auxiliary_contactor_vcb_closed = 11;
}
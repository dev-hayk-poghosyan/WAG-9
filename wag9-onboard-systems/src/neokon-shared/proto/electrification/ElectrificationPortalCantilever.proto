syntax =  "proto3";
package proto.electrification;

import "ElectrificationEnumTypes.proto";

/**
 * Блок данных описания подвеса под жесткой поперечиной.
 * Подвесом может быть фиксаторная или консольная стойка.
 *
 *  Местоположение подвеса однозначно определяется на основании пути, над которым он подвешен
 *  и ИД жесткой поперечины. Поле tension_length_id содержит ИД своего участка КС.
 *  ИД для поперечины не нужен, поскольку данный блок вложен в блок данных
 *  для своей жесткой поперечины.
 */
message PortalCantilever
{
    /**
     * ИД участка КС. 
     */
    int32 tension_length_id = 1;

    /**
     * Индекс пресета для генерации/подбора модели опоры.
     */
    int32 preset_idx = 2;

   /**
    * Флаг-признак, того что консольная стойка развернута в
    * противоположную сторону. Положение консольной стойки по умолчанию
    * под жесткой поперечиной определяется правилом левой руки для участка КС.
    * (см. ElectrificationCoveredPath.proto).
    * Из положения по умолчанию консольная стойка может быть повернута
    * на 180 градусов относительно точки крепления проводов на фиксаторе.
    */
    bool is_flipped = 3;

    /**
     * Сторона установки фиксаторов справа или слева от полотна; по правилу левой руки.
     * Есди значение отсутствует, используется дефолтная сторона
     * Не дублирует флаг is_flipped, соответствует аналогичному параметру для кастомных опор
     */
    optional PoleSide.Type pole_side = 4;

    /**
     * Имя ноды фиксатора или стойки. Если назначено, используется вместо стандартных нод пресета.
     * Нода должна находиться в списке допустимых нод в файле соответствующего пресета.
     */
    optional string node_name = 5;
}

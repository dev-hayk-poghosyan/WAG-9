syntax = "proto3";
package proto.electrification;

import "ElectrificationManualCantilever.proto";
import "ElectrificationEnumTypes.proto";

/**
 * Блока данных для дополнительных опор.
 * Дополнительные опоры создаются пользователем и дополняют/замещают
 * набор автоматически сгенерированных опор.
 */
message ManualPole
{
    /**
     * Базовые свойства, общие как для опор так и для подвесов.
     */
    ManualCantilever base_fields = 1;

    /**
     * Расстояние пивота опоры от оси пути вдоль нормали к данной точке пути.
     */
    double path_normal_distance_m = 2; 

    /**
     * Высота пивота над поверхностью катания.
     */
    double height_above_path_m = 3;

    /**
     * Угол поворота вокруг пивота, в градусах
     */
    double angle_deg = 4;

    /**
     * Сторона установки опор справа или слева от полотна; по правилу левой руки.
     * Есди значение отсутствует, используется сторона связанного объекта (при его наличии)
     */
    optional PoleSide.Type pole_side = 5;
}

syntax = "proto3";
package proto.electrification.alternative_preset;

/**
 * Подвесы или стойки под жесткими поперечинами.
 */
message PortalSuspension
{
    /**
     * Подвесы со сдвоенными консолями для сопряжений и воздущных стрелок.
     * Имена файлов нод указываются с маской подстановки *, которая заменяется на префикс
     * содержащий число проводов и тип фиксатора: [число проводов]_[тип фиксатора].
     * Подстановки для сопряжений и участок КС: 2w(1w)_pz(oz,ocv,pcv).
     * Подстановки для воздушных стрелок: 2w(1w,1w2,2w1)_jz(jcv).
     */
    message DoubleSuspensionNodes
    {
        /**
         * Общий каталог, в котором храняться ноды,
         * имена которых указаны в следующих полях структуры.
         * Значение - путь относительно папки data.
         */
        string spn_double_node_path = 1;

        /**
         * Подвес для неизолированного сопряжения A.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string spn_A = 2;

        /**
         * Подвес для неизолированного сопряжения B.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string spn_B = 3;

        /**
         * Подвес для неизолированного сопряжения C.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string spn_C = 4;

        /**
         * Подвес для изолированного сопряжения A.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string spn_ins_A = 5;

        /**
         * Подвес для изолированного сопряжения B.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string spn_ins_B = 6;

        /**
         * Подвес для изолированного сопряжения C.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string spn_ins_C = 7;

        /**
         * Подвес для воздушной стрелки, левый путь.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string spn_junction_L = 8;

        /**
         * Подвес для воздушной стрелки, правый путь.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string spn_junction_R = 9;
    }

    /**
     * Подвес с одинарной консолью для участокв КС.
     * Значение - полный путь к файлу ноды относительно папки data.
     * Имя файла ноды в конце пути указывется с маской подстановки *.
     */
    string spn_node = 1;

    /**
     * Подвесы со сдвоенными консолями для сопряжений и воздущных стрелок.
     */
    DoubleSuspensionNodes spn_double_node = 2;

    /**
     * Смещение в метрах по высоте относительно точки пивота для подвеса.
     */
    double spn_z_shift_m = 3;
}

syntax = "proto3";
package proto.electrification;

import "ElectrificationConsole.proto";
import "ElectrificationEnumTypes.proto";
import "ElectrificationPole.proto";

/**
 * Ручное (кастомное) устройство поддержки КС - общее название для опор и подвесов.
 * В данном случае слово "ручной" означает что данные опоры и подвесы,
 * вручную добавляются пользователем к набору автоматически сгенерированных.
 */
message ManualCantilever
{
    /**
     * ID объекта.
     */
    int32 object_id = 1;

    /**
     * UUID пути в строковом виде.
     */
    string path_uuid = 2;

    /**
     * Дистанция от начала жд-пути с идентификатором заданным path_uuid.
     */
    double distance_along_path = 3;

    /**
     * Индекс пресета для генерации/подбора модели опоры.
     */
    int32 preset_idx = 4;

    /**
     * Тип опоры: промежуточная опора анкерного участка или переходная опора сопряжения.
     */
    Pole.Type pole_type = 5;

    /**
     * Подтип для переходных опор сопряжений. Для данного
     * поля значение устанавливается в случае, если свойство
     * pole_type имеет значение TRANSITIONAL.
     */
    optional Pole.TransitionalType transitional_type = 6;

    /**
     * Тип консоли (наклонная, горизонтальная, изогнутая, изолированная)
     */
    Console.Type console_type = 7;

    /**
     * Тип фиксатора (прямой, обратный, а также их аналоги для
     * закругленных путей и воздушных стрелок)
     */
    RegistrationArm.Type registration_arm_type = 8;

    /**
     * Развернуть фиксаторы после их расчета. То есть прямой меняется на обратный и наоборот.
     * Фиксаторы на кривых участках тоже разрешается разворачивать.
     */
    bool flip_registration_arms = 9;

    /**
     * Имя ноды фиксатора или стойки. Если назначено, используется вместо стандартных нод пресета.
     * Нода должна находиться в списке допустимых нод в файле соответствующего пресета.
     */
    optional string node_name = 10;

    /**
     * Сторона установки фиксаторов справа или слева от полотна; по правилу левой руки.
     * Есди значение отсутствует, используется дефолтная сторона
     * Не дублирует флаг is_flipped, соответствует аналогичному параметру для кастомных опор
     */
    optional PoleSide.Type pole_side = 11;
}

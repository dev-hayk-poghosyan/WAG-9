syntax = "proto3";
package proto.electrification;

import "ElectrificationEnumTypes.proto";

message ManualWire
{
    /**
     * ИД первой точки крепления.
     * Точка крепления может быть кастомной опорой, подвесом,
     * боковой опорой жесткой поперечины или участком КС.
     * Если ИД принадлежит участку КС, соединяться будет крайняя опора или подвес.
     */
    int32 object_id_a = 1;

    /**
     * Группа точек, к которой прекрепляется подвеска, для первой опоры или подвеса
     */
    string cantilever_group_a = 2;

    /**
     * ИД второй точки крепления.
     * Точка крепления может быть кастомной опорой, подвесом,
     * боковой опорой жесткой поперечины или участком КС.
     * Если ИД принадлежит участку КС, соединяться будет крайняя опора или подвес.
     */
    int32 object_id_b = 3;

    /**
     * Группа точек, к которой прекрепляется подвеска, для второй опоры или подвеса
     */
    string cantilever_group_b = 4;

    /**
     * Тип анкеровки на первой соединяемой точке, по умолчанию анкеровка отсуствует.
     */
    Tensioning.Type tensioning_type_a = 5;

    /**
     * Тип анкеровки на второй соединяемой точке, по умолчанию анкеровка отсуствует.
     */
    Tensioning.Type tensioning_type_b = 6;
}

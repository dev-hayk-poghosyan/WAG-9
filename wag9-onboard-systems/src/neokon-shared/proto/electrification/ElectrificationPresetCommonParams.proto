syntax = "proto3";
package proto.electrification.preset;

/**
 * Общие параметры, затрагивающие все элементы контактной сети.
 */
message CommonParams
{
   /**
    * Код проекта. Используется как строковый преффикс в имени выбираемой ноды.
    */
   message ProjectCode
   {
       enum Type
       {
           KS120 = 0;    //КС времен СССР, < 120 км/ч
           KS160 = 1;    //Современная КС, < 160 км/ч
           KS200 = 2;    //Современная КС, < 200 км/ч
           KS250 = 3;    //Современная КС, < 250 км/ч
       }
   }

   /**
    * Индекс типа подвески.
    */
   message CatenaryTypeIdx
   {
       enum Type
       {
           T1W = 0;    //одинарный контактный провод
           T2W = 1;    //двойной контактный провод 
           T1W1 = 2;    //стрелочная опора, обе ветви 1 КП
           T1W2 = 3;    //слева направо от опоры 1 КП, 2 КП
           T2W1 = 4;    //слева направо от опоры 2 КП, 1 КП
           T2W2 = 5;    //обе ветви двойной 2 КП
       }
   }

   /**
    * Профильное сечение балок консоли.
    */
   message ConsoleProfileCut
   {
       enum Type
       {
           TUBE = 0;       //трубчатое
           CHANNEL = 1;    //швеллер
       }
   }

   /**
    * Код проекта.
    */
   ProjectCode.Type project_code = 1;

   /**
    * Индекс типа подвески.
    */
   CatenaryTypeIdx.Type catenary_type_idx = 2;

   /**
    * Профильное сечение балок консоли.
    */
   ConsoleProfileCut.Type console_profile_cut = 3;
}

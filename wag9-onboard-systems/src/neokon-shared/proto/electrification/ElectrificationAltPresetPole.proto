syntax = "proto3";
package proto.electrification.alternative_preset;

/**
 * Одиночные опоры для участков КС.
 */
message Pole
{
    /**
     * Опоры со сдвоенными консолями для сопряжений и воздущных стрелок.
     * Имена файлов нод указываются с маской подстановки *, которая заменяется на префикс
     * содержащий число проводов и тип фиксатора: [число проводов]_[тип фиксатора].
     * Подстановки для сопряжений и участок КС: 2w(1w)_pz(oz,ocv,pcv).
     * Подстановки для воздушных стрелок: 2w(1w,1w2,2w1)_jz(jcv).
     */
    message DoublePoleNodes
    {
        /**
         * Общий каталог, в котором храняться ноды,
         * имена которых указаны в следующих полях структуры.
         * Значение - путь относительно папки data.
         */
        string pole_double_node_path = 1;

        /**
         * Опора для неизолированного сопряжения A.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string pole_A = 2;

        /**
         * Опора для неизолированного сопряжения B.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string pole_B = 3;

        /**
         * Опора для неизолированного сопряжения C.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string pole_C = 4;

        /**
         * Опора для изолированного сопряжения A.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string pole_ins_A = 5;

        /**
         * Опора для изолированного сопряжения B.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string pole_ins_B = 6;

        /**
         * Опора для изолированного сопряжения C.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string pole_ins_C = 7;

        /**
         * Опора для воздушной стрелки, левый путь.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string pole_junction_L = 8;

        /**
         * Опора для воздушной стрелки, правый путь.
         * Значение - имя ноды с расширением .node и маской * для подстановки
         * числа проводов и типа фиксатора.
         */
        string pole_junction_R = 9;
    }

    /**
     * Опора с одинарной консолью для участокв КС.
     * Значение - полный путь к файлу ноды относительно папки data.
     * Имя файла ноды в конце пути указывется с маской подстановки *.
     */
    string pole_node = 1;

    /**
     * Опоры со сдвоенными консолями для сопряжений и воздущных стрелок.
     */
    DoublePoleNodes pole_double_node = 2;
}

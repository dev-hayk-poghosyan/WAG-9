syntax = "proto3";
package proto.electrification;

/**
 * Боковая опора жесткой поперечины.
 * Данные объекты создаются при необходимости, в случае,
 * если к боковой опоре крепится анкеровка. Тогда её необходимости
 * идентифицировать в системе.
 */
message PortalPillar
{
    /**
     * Сторона расположения опоры относительно поперечины,
     * если смотреть в направлении оси Ох координатного базиса поперечины.
     */
    enum Side 
    {
        LEFT = 0; //слева
        RIGHT = 1; //справа
    }

    /**
     * ID объекта.
     */
    int32 object_id = 1;

    /**
     * ИД поперечины, которой принадлежит данная опора.
     */
    int32 portal_id = 2;

    /**
     * Сторона расположения опоры относительно поперечины.
     */
    Side side = 3;
}

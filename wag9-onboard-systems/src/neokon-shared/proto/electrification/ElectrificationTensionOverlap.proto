syntax = "proto3";
package proto.electrification;

import "ElectrificationCatenaryLengthConfig.proto";
import "ElectrificationCachedPolePositions.proto";

/**
 * Блок данных для описания сопряжения между участками КС.
 * Сопряжение участков КС - это совокупность переходных опор (с двойными консолями),
 * а также их соединений подвесками как друг с другом, так и анкерными опорами от премыкающих участков КС.
 * Примечание - опоры с анкеровкой логически принадлежат участку КС, а не сопряжениям.
 */
message TensionOverlap
{
    enum Type
    {
        INSULATED = 0; // изолированное
        NONINSULATED = 1; // неизолированное
    }

    /**
     * ИД сопряжения.
     */
    int32 id = 1;

    /**
     * ИД участка КС в начале сопряжения (соединение с опорой А).
     */
    int32 start_tension_id = 2;

    /**
     * ИД участка КС в конце сопряжения (соедиение с опорой Б).
     */
    int32 end_tension_id = 3;

    /**
     * Количество пролетов сопряжения (по умолчанию 3 пролета).
     * Считаем только пролеты между переходными опорами.
     */
    int32 num_intervals = 4;

    /**
     * Тип сопряжения (изолированное/неизолированное).
     */
    Type overlap_type = 5;

    /**
     * Упорядоченный список соединенных переходных опор (от start до end сопряжения).
     */
    repeated int32 double_cantilever_ids = 6;

    /**
    * Параметры для генерации участка КС.
    */
    CatenaryLengthConfig config = 7;

    /**
     * Рассчитанные позиции опор
     */
    CachedPolePositions cached_pole_positions = 8;
}

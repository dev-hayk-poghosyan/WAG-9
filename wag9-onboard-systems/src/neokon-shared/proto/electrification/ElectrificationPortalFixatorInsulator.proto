syntax = "proto3";
package proto.electrification;

/**
 * Блок данных для изоляторов под жесткими поперечинами.
 */
message PortalFixatorInsulator
{
    /**
     * ID объекта.
     */
    int32 object_id = 1;

    /**
     * ИД поперечины, которой принадлежит данный подвес.
     */
    int32 portal_id = 2;

    /**
     * Дистанция от начала поперечины до изолятора
     */
    double distance_along_width = 3;

    /**
     * Смещение по вертикали от средней высоты поперечины.
     * Данное смещение нужно в том случае, если пути под поперечиной расположены на разной высоте.
     */
    double average_portal_z_shift = 4;

    /**
    * Флаг-признак того, что изолятор развёрнут в противоположную сторону
    * относительно подвесов
    */
    bool is_flipped = 5;
}

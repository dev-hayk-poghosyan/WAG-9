syntax = "proto3";
package proto.electrification.alternative_preset;

import "ElectrificationAltPresetAttachableNode.proto";

/**
 * Блок данных поперечины
 */
message Portal
{
    // Настройки опор
    /**
     * Левая боковая опора жесткой поперечины. Путь к файлу ноды относительно папки data.
     */
    string left_pole_node = 1;

    /**
     * Правая боковая опора жесткой поперечины. Путь к файлу ноды относительно папки data.
     */
    string right_pole_node = 2;

    /**
     * Смещение от крайней точки поперечины до оси опоры в сторону центра.
     */
    double left_portal_pole_gap = 3;

    /**
     * Смещение от крайней точки поперечины до оси опоры в сторону центра.
     */
    double right_portal_pole_gap = 4;

    // Настройки фиксаторного троса
    /**
     * Включение/отключение троса.
     */
    bool allow_span_wire = 5;

    /**
     * Фиксаторный трос, крепится между опорами к точкам ft0.
     */
    double span_wire_diameter = 6;

    /**
     * Если расстояние между подвесами больше этого значения, устанавливается изолятор.
     */
    double span_wire_insulator_track_distance = 7;

    /**
     * Если расстояние между подвесами больше этого значения, устанавливается два изолятора.
     */
    double span_wire_insulator_double_distance = 8;

    /**
     * Расстояние от центра подвеса до изолятора для участков с двумя изоляторами
     */
    double span_wire_insulator_offset = 9;

    /**
     * Изолятор фиксаторного троса. Путь к файлу ноды относительно папки data.
     */
    string span_wire_insulator_node = 10;

    // Настройки жёсткой поперечины
    /**
     * Несущая конструкция (перекладина) фермы. Путь к файлу ноды относительно папки data.
     * Имя файла содержит символ подстановки '*'. Символ подстановки '*' - число с точкой,
     * означает длину. Должно выбираться в свойствах из списка доступных. (прим. 11.6, 20).
     * Если точку использовать нежелательно, можно записать длину в мм.
     */
    string crossbar_node = 11;

    /**
     * Смещение в метрах по высоте относительно точки пивота для ригеля.
     */
    double crossbar_z_shift_m = 12;

    // Настройки гибкой поперечины
    /**
     * Является ли поперечина гибкой. Для гибкой поперечины настройки ригеля игнорируются
     */
    bool is_cross_span = 13;

    /**
     * Коэффициент провисания поперечного троса.
     */
    double cross_wire_sagging_coefficient = 14;

    /**
     * Изолятор поперечного троса. Путь к файлу ноды относительно папки data.
     */
    string cross_wire_insulator_node = 15;

    /**
     * Электрический соединитель между поперечным и верхним тросом подвесов.
     * По принципу струны масштабируется по высоте чтобы попасть в промежуток между тросами.
     */
    AttachableNode span_wire_connector = 17;

    /**
     * Расстояние от подвеса, на котором находится электрический соединитель.
     */
    double span_wire_connector_offset = 18;

    /**
     * Траверса или зажим. Путь к файлу ноды относительно папки data.
     */
    string dropper_clamp = 19;
}


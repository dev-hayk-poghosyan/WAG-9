syntax = "proto3";
package proto.electrification;

import "ElectrificationTensionLength.proto";
import "ElectrificationTensionOverlap.proto";

/**
 * Блок данных описания электрофицированного пути.
 * Электрифицированный путь - составной объект, который включает в себя
 * дочерние участки пути и сопряжения. Электрифицированный путь управляет
 * дочерними объектами, создавая их по заданным характеристикам и размещая их вдоль
 * заданного пути, в нужном порядке. Кроме того, путь выравнивает опоры дочерних объектов
 * относительно другого электрифицированного пути, если таковой задан.
 */
message TensionPath
{
    /**
     * Доступ к полям базового объекта, от которого наследуется
     * TensionPath. Объекты TensionPath основаны на объектах TensionLength.
     * В полях базового объекта также хранится ID объекта. 
     */
    TensionLength base_object_fields = 1;

    /**
     * Тип дочерних сопряжений.
     */
    TensionOverlap.Type tension_overlap_type = 2;

    /**
     * Количество интервалов дочерних сопряжений.
     */
    int32 tension_overlap_num_intervals = 3;

    /**
     * Количество интервалов дочерних участков КС.
     */
    int32 tension_length_num_intervals = 4;

    /**
     * Сохранять пользовательские опоры при выравнивании.
     */
    bool keep_custom_poles_by_aligning = 5;

    /**
     * Упорядоченный массив ИД дочерних объектов.
     */
    repeated int32 child_tension_object_ids = 6;

    /**
     * ИД родительского пути. Если задан - выполняется выравнивание
     * относительно данного пути.
     */
    optional int32 parent_tension_path_id = 7;
}

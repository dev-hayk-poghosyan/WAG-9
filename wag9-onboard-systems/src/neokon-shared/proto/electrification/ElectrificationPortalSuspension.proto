syntax = "proto3";
package proto.electrification;

import "ElectrificationManualCantilever.proto";

/**
 * Блок данных для подвесов под жесткими поперечинами.
 */
message PortalSuspension
{
    /**
     * Базовые свойства, общие как для опор так и для подвесов.
     */
     ManualCantilever base_fields = 1;

    /**
     * ИД поперечины, которой принадлежит данный подвес.
     */
    int32 portal_id = 2;

    /**
     * Смещение по вертикали от средней высоты поперечины.
     * Данное смещение нужно в том случае, если пути под поперечиной расположены на разной высоте.
     */
    double average_portal_z_shift = 3;

    /**
    * Флаг-признак того, что консольная стойка развернута в
    * противоположную сторону. Положение консольной стойки по умолчанию
    * под жесткой поперечиной определяется правилом левой руки для участка КС.
    * (см. ElectrificationCoveredPath.proto).
    * Из положения по умолчанию консольная стойка может быть повернута
    * на 180 градусов относительно точки крепления проводов на фиксаторе.
    */
    bool is_flipped = 4;
}

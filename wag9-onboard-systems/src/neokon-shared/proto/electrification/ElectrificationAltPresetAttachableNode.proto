syntax = "proto3";
package proto.electrification.alternative_preset;

/**
 * Прикрепляемые к подвеске элементы, имеющие несколько вариантов,
 * отличающиеся длиной (не более трёх). Генератор подвески выбирает подходящий файл ноды
 * в зависимости от расстояния между несущим тросом (НТ) и контактным проводом (КП).
 * Каждое поле содержит путь к файлу ноды относительно папки data.
 * Названия полей short/medium/long условные и не имеют привязки к конкретным значениям;
 * размеры ноды вычисляются генератором.
 */
message AttachableNode
{
    /**
     * Путь к файлу ноды относительно папки data
     */
    string short_node = 1;
    /**
     * Путь к файлу ноды относительно папки data
     */
    string medium_node = 2;
    /**
     * Путь к файлу ноды относительно папки data
     */
    string long_node = 3;
}

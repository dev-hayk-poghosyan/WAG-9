syntax = "proto3";
package proto.electrification.preset;

/**
 * Стойка для одиночной опоры или жесткой поперечины.
 */
message Pillar
{
    /**
     * Количество опор для стойки жесткой поперечины и высота опор в метрах.
     * Только для жестких поперечин.
     */
    enum Type
    {
        T1X10 = 0;    //Одна опора на стойку, высота 10 м.
        T1X12 = 1;    //Одна опора на стойку, высота 12 м.
        T2X10 = 2;    //Две опоры на стойку, высота 10 м.
        T2X12 = 3;    //Две опоры на стойку, высота 12 м.
    }

    /**
     * Материал стойки.
     */
    message Material
    {
        enum Type
        {
            CONCRETE = 0;     //железобетонная опора
            METAL = 1;        //металическая опора
        }
    }
}

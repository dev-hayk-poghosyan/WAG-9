syntax = "proto3";
package proto.electrification;

/** 
 * Тип подвески.
 */
message Catenary
{ 
    enum Type
    {
        SIMPLE = 0; //безрессорная 
        STITCHED = 1; //рессорная 
    }
}

/** 
 * Тип компенсации анкеров.
 */
message Tensioning
{
    enum Type
    {
        NONE = 0;    //анкеровка отсутствует.
        FIXED = 1;   //жесткая анкеровка 
        COMPENSATED = 2; //компенсировання 
        SEMICOMPENSATED = 3; //полукомпенсированная
    }
}

/**
 * Сторона расположения опор (справа или слева) относительно
 * направления построения участка от начала к концу.
 */
message PoleSide
{
    enum Type
    {
        LEFTHAND = 0;    //консоль направлена в сторону вытянутой левой руки
        RIGHTHAND = 1;   //консоль направлена в сторону вытянутой правой руки 
    }
}

/**
 * Тип фиксатора консоли опоры или подвеса. 
 */
message RegistrationArm
{
    enum Type
    {
        STRAIGHT_PULL_OFF = 0; //прямой фиксатор для прямого пути
        STRAIGHT_PUSH_OFF = 1; //обратный фиксатор для прямого пути
        STRAIGHT_JUNCTION = 2; //опора воздушной стрелки
        CURVE_PULL_OFF = 3; //прямой фиксатор для установки с внешней стороны кривой
        CURVE_PUSH_OFF = 4; //обратный фиксатор для установки на внутренней стороне кривой
        CURVE_JUNCTION = 5; //опора воздушной стрелки в кривой (оба фиксатора однонаправленные)
    }
}

/**
 * Положение участка относительно сопряжений.
 * Необходимо для задания наличия рессоры на концах
 */
message PathPlacement
{
    enum Type
    {
        NONE = 0; // одиночный объект
        INNER = 1; // объект имеет двух соседей
        START = 2; // объект имеет соседа только с начала участка
        END = 3; // объект имеет соседа только с конца участка
    }
}

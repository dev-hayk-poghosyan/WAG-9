syntax = "proto3";
package proto.electrification;

import "ElectrificationConsole.proto";
import "ElectrificationEnumTypes.proto";

/**
 * Блок данных для описания жд-опоры, созданной и/или модифицированной
 * пользователем.
 */
message Pole
{
    /**
     *  Тип опоры в контексте участка пути.
     */
    enum Type
    {
        MIDDLE = 0;
        TRANSITIONAL = 1;
        PORTAL_PILLAR = 2;
    }

    /**
     *  Подтип для промежуточных опор сопряжения.
     */
    enum TransitionalType
    {
        TRANSITIONAL_A = 0; //первая опора сопряжения
        TRANSITIONAL_B = 1; //последняя опора сопряжения
        TRANSITIONAL_C = 2; //средняя опора 4-пролетного сопряжения
        TRANSITIONAL_A_INSULATED = 3; //первая опора изолированного сопряжения
        TRANSITIONAL_B_INSULATED = 4; //последняя опора изолированного сопряжения
        TRANSITIONAL_C_INSULATED = 5; //средняя опора 4-пролетного изолированного сопряжения
    }

    /**
     * ИД участка КС. 
     */
    int32 tension_length_id = 1;

    /**
     * Индекс пресета для генерации/подбора модели опоры.
     */
    int32 preset_idx = 2;

    /**
     * Дистанция от начала участка КС.
     */
    double distance_along_tension_length_m = 3; 

    /**
     * Расстояние пивота опоры от оси пути вдоль нормали в данной точки пути.
     */
    double path_normal_distance_m = 4; 

    /**
     * Высота пивота над поверхностью катания.
     */
    double height_above_path_m = 5;

    /**
     * Угол поворота вокруг пивота, в градусах
     */
    double angle_deg = 6;

    /**
     * Тип опоры: промежуточная опора анкерного участка или переходная опора сопряжения.
     */
    Type pole_type = 7;

    /**
     * Флаг, определяющий пора или подвес. Для подвеов под жесткие поперечины
     * флаг устанавливается в true.
     */
    bool is_suspension = 8;

    /**
     * Тип консоли (наклонная, горизонтальная, изогнутая, изолированная)
     */
    Console.Type console_type = 9;

    /**
     * Тип фиксатора (прямой, обратный, а также их аналоги для
     * закругленных путей и воздушных стрелок)
     */
    RegistrationArm.Type registration_arm_type = 10;

    /**
     * Подтип для переходных опор сопряжений. Для данного
     * поля значение устанавливается в случае, если свойство
     * pole_type имеет значение TRANSITIONAL.
     */
    optional TransitionalType transitional_type = 11;

    /**
     * Имя ноды опоры. Если назначено, используется вместо стандартных нод пресета.
     * Нода должна находиться в списке допустимых нод в файле соответствующего пресета.
     */
    optional string node_name = 12;

    /**
     * Сторона установки опор справа или слева от полотна; по правилу левой руки.
     * Есди значение отсутствует, используется сторона связанного объекта
     */
    optional PoleSide.Type pole_side = 13;
}

syntax = "proto3";
package proto.electrification;

/**
 * Блок данных для описания пути, охваченного КС. 
 */
message CoveredPath
{
    /**
     * Список UUID путей из RoadSet.json, в виде массива строк.
     * Индентификаторы упорядочены от первого к последнему по построению участка КС.
     * Направление участка КС определяется правилом левой руки:
     * 1. Встать лицом к опоре и вытянуть левую руку в сторону.
     * 2. Консоль опоры параллельна вытянутой руке и так же направлена влево.
     * 3. Если первые два условия соблюдены, значит лицом мы обращены в направлении
     *    построения участка - от начала к концу.
     */
    repeated string ordered_path_uuids = 1;

    /**
     *  Расстояние в метрах от начала первого UUID, где начинается КС.
     */
    double first_path_start_distance_m = 2;

    /**
     *  Расстояние в метрах от начала последнего UUID, где начинается КС.
     */
    double last_path_start_distance_m = 3;
}

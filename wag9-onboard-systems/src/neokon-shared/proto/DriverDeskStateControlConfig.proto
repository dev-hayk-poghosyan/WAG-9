syntax = "proto3";
package proto;

/**
 * This is the configuration of the controls that will be monitored before starting work.
 * This contains a description of the elements and a list of configurations for each
 * of the start modes.
 */
message DriverDeskStateControlConfig
{
    message Value
    {
        string name = 1;
        int32 value = 2;
    }

    message Element
    {
        string name = 1;
        string localization_label = 2;
        repeated Value values = 3;
    }

    message Config
    {
        string start_mode = 1;
        repeated Value target_values = 2;
    }

    repeated Element elements = 1;
    repeated Config configs = 2;
}

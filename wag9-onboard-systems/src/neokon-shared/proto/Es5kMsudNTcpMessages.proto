syntax = "proto3";
package proto.es5k.boardcomputer;
option csharp_namespace = "Msud_N_net";

/**
 * Это сообщение-контейнер. Передается в Msud из контроллера поезда TrainSim.
 */
message TcpToMsudNBiMessage
{
    oneof value
    {
        // включение питания программы
        bool power = 2;

        // нажатие на кнопку пленочной клавиатуры
        KeyboardButton keyboard_button = 3;

        // контроль оборудования
        bool equipment_control_tc = 4;
        bool equipment_control_db = 17;
        bool equipment_control_mk = 18;
        bool equipment_control_dm = 19;
        bool equipment_control_dp = 20;
        bool equipment_control_ob = 21;
        bool equipment_control_kz = 22;
        bool equipment_control_ov = 23;
        bool equipment_control_cme = 24;
        bool equipment_control_td = 25;
        bool equipment_control_si = 26;
        bool equipment_control_msud = 27;
        bool equipment_control_r = 28;

        //режим работы
        OperationalMode operation_mode = 5;

        //реверс
        Reverse reverse = 6;

        //тяга или торможение
        SchemeMode scheme_mod = 7;

        //схема собрана или разобрана
        bool assembled_scheme = 8;

        SectionParameters section_parameter = 9;

        //зоны вип
        float vip_areas = 10;

        //сила тяги (kH)
        int32 traction_power = 12;

        //сила торможения (kH)
        int32 braking_force = 13;

        //текущее значение скорости (km/h)
        int32 actual_speed = 36;

        //заданное значение скорости (km/h)
        int32 target_speed = 14;

        //текущее значение тока (A)
        int32 actual_anchor_amperage = 37;

        //заданное значение тока (A)
        int32 target_anchor_amperage = 15;

        //текущее значение напряжения на ТД (B)
        int32 actual_voltage = 16;

        // ток возбуждения (A)
        int32 excitation_amperage = 38;

        //выводимое время и дата unixtime
        int64 current_time_sec = 1;

        //токоприемники
        float sp27_p = 29;
        float sp27_p_n = 30;
        float sp27_d_p = 31;
        float sp28_p = 32;
        float sp28_p_n = 33;
        float sp28_d_p = 34;
        bool no_communication_master_section_bpy = 39;
        bool no_communication_slave_section_bpy = 40;
        bool no_communication_master_section_sp27 = 41;
        bool no_communication_slave_section_sp28 = 42;

        EquipmentState equipment_state = 35;
    }
}

/**
 * Это сообщение - набор параметров одной секции локомотива.
 * Переключатели, реле, значения приборов и т.д.
 */
message SectionParameters
{
    int32 number_of_section = 1;
    // фактическая скорость ТД1 (km/h)
    int32 actual_speed_1 = 2;

    // фактическая скорость ТД2 (km/h)
    int32 actual_speed_2 = 3;

    // фактическая скорость ТД3 (km/h)
    int32 actual_speed_3 = 4;

    // фактическая скорость ТД4 (km/h)
    int32 actual_speed_4 = 5;

    // фактическое значение тока якорей ТД (A)
    int32 actual_anchor_amperage_1 = 6;

    // фактическое значение тока якорей ТД (A)
    int32 actual_anchor_amperage_2 = 7;

    // фактическое значение тока якорей ТД (A)
    int32 actual_anchor_amperage_3 = 8;

    // фактическое значение тока якорей ТД (A)
    int32 actual_anchor_amperage_4 = 9;

    // ток возбуждения (A)
    int32 excitation_amperage = 10;

    //Есть ли соосное боксование
    bool boxing = 11;

    //зона ВИП1 (0-4.0)
    float zone_vip_1 = 12;
    //Uкс
    int32 u_ks_vip_1 = 13;
    //Uтд
    int32 u_td_vip_1 = 14;
    int32 alpha_p_vip_1 = 15;
    int32 alpha_b_vip_1 = 16;
    int32 gama_vip_1 = 17;
    int32 beta_vip_1 = 18;
    int32 alpha_h_1_vip_1 = 19;
    int32 alpha_h_2_vip_1 = 20;

    //зона ВИП2 (0-4.0)
    float zone_vip_2 = 21;
    //Uкс
    int32 u_ks_vip_2 = 22;
    //Uтд
    int32 u_td_vip_2 = 23;
    int32 alpha_p_vip_2 = 24;
    int32 alpha_b_vip_2 = 25;
    int32 gama_vip_2 = 26;
    int32 beta_vip_2 = 27;
    int32 alpha_h_1_vip_2 = 28;
    int32 alpha_h_2_vip_2 = 29;

    // Iя1, Iя2, Uя2 +Uпит
    bool i1_i2_u2_plus_u = 30;
    // Iя1, Iя2, Uя2 -Uпит
    bool i1_i2_u2_minus_u = 31;
    // Iя3, Iя4, Uя4 +Uпит
    bool i3_i4_u4_plus_u = 32;
    // Iя4, Iя4, Uя4 -Uпит
    bool i3_i4_u4_minus_u = 33;
}

/**
 * Это сообщение-контейнер. Передается из Msud в контроллер поезда TrainSim.
 */
message TcpFromMsudNBiMessage
{
    int32 field_weakening = 1;
    bool automatic_op_active = 2;
    bool security_boxing_active = 3;
}

/**
 * Это сообщение - набор параметров для посылки состояния определенного коннектора в Fault Station.
 */
message EquipmentState
{
    int32 number_of_section = 1;
    EquipmentConnector connector = 2;
    bool state = 3;
}


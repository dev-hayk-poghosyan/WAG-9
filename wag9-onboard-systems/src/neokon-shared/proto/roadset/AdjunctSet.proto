syntax = "proto3";
package proto;

import "RailPathAdjunct.proto";

message AdjunctSet
{
    /**
     * A list of relative paths to *.meshgen files with generator settings.
     *
     * Each adjunct may specify the particular preset to use, by providing an index
     * into this list.
     */
    repeated string all_adjuncts_presets = 1;

    /**
     * A list of adjuncts for railway path like conductor or guard rails.
     */
    repeated RailPathAdjunct path_adjuncts = 2;
}

syntax = "proto3";
package proto.class390.tmdd;

message TcpToTMDDMessage {
    // Массив состояния дверей состава
    repeated Door doors = 1;

    oneof value {
        // Состояние автомата CB-TMDD (Вкл/Выкл)
        bool initialization = 2;

        // Положение ключа реверса
        ReverseKey reverse_key = 3;

        // Нажатая клавиша на пленочной клавиатуре
        KeyboardButton keyboard_button = 4;

        // Состояние определённой ошибки
        Fault fault = 5;

        // Сброс программы (Вкл)
        bool reset = 6;

        // Доступность системы наклона поезда (Tilt system) (Вкл/Выкл)
        bool tilt_available = 7;

        // Значение установленной скорости
        int32 set_speed = 8;

        // Перейти на экран SDO
        bool move_to_screen_sdo = 9;

        // Включить тусклый режим
        bool screen_dim = 10;

        // Принудительный буст мод
        bool forced_boost_mod = 11;

        RepeaterConfig new_repeater_config = 12;
    }

    message RepeaterConfig
    {
        int32 repeatTcpPort = 1;
        int32 repeatUdpPort = 2;
        string repeatIP = 3;
    }
}

message TcpFromTMDDMessage {
    oneof value {
        // Состояние эко мода (Вкл/Выкл)
        bool eco_mode = 1;

        // Возвращает введеный оператором код
        string operator_code = 2;

        // Возвращает введеный оператором номер "VT...."
        string operator_number = 3;

        // Авторизован ли пользователь
        bool logged_in = 4;

        // Авторизирована ли программа
        bool is_initialized = 5;
    }
}

enum ReverseKey {
    REVERSE_OFF = 0;
    REVERSE_FORWARD = 1;
    REVERSE_NEUTRAL = 2;
    REVERSE_REVERSE = 3;
}

enum KeyboardButton {
    BTN_NONE = 0;
    BTN_4 = 1;
    BTN_3 = 2;
    BTN_2 = 3;
    BTN_1 = 4;
    BTN_5 = 5;
    BTN_RIGHT = 6;
    BTN_DOWN = 7;
    BTN_UP = 8;
    BTN_LEFT = 9;
    BTN_ENTER = 10;
    BTN_F4 = 11;
    BTN_F3 = 12;
    BTN_F2 = 13;
    BTN_F1 = 14;
    BTN_CLEAR = 15;
    BTN_9 = 16;
    BTN_8 = 17;
    BTN_7 = 18;
    BTN_6 = 19;
    BTN_0 = 20;
}

message Fault {
    // идентификационный номер ошибки
    FaultId fault_id = 1;

    // индекс вагона (0-10) {K, J, H, G, U, F, E, D, C, B, A}
    int32 coach_index = 2;

    // действие над ошибкой (Включить/Выключить)
    bool state = 3;
}


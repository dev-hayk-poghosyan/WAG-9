message Door {
    // индекс вагона (0-10) {K, J, H, G, U, F, E, D, C, B, A}
    int32 coach_index = 1;

    // номер двери (0-3) (передняя правая/задняя правая/передняя левая/задняя левая)
    int32 number = 2;

    //Состояние двери (0-6) {CLOSED, OPENED, IN_PROCESS, FAULT, OUT_OF_USE, INHIBITED, ENABLED}
    int32 state = 3;
}

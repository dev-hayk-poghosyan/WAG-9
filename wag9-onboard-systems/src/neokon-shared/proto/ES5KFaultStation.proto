{
    bool pantograph_lifted = 1;
    bool spotlight_lit = 2;
    bool buffer_left_white_lit = 3;
    bool buffer_right_white_lit = 4;
    bool buffer_left_red_lit = 5;
    bool buffer_right_red_lit = 6;
}
/**
 * Это сообщение - набор параметров для шкафа автоматов в Fault Station.
 * Приборы, автоматы, лампы и т.д.
 */
message ToPanelValues
{
    float pv = 1;
    float pa = 2;
}

/**
 * Это сообщение-контейнер. Передается из Fault Station в контроллер поезда TrainSim.
 */
message FromPanelValues
{
    oneof value
    {
        int32 sa3 = 1;
        int32 sa2 = 2;
        int32 sa1 = 3;
        bool s4 = 4;
        bool s3 = 5;
        bool s2 = 6;
        bool s1 = 7;
        bool saut = 8;
    }
}

/**
 * Это сообщение - набор параметров для модельки секции в Fault Station.
 * Пантограф, огни.
 */

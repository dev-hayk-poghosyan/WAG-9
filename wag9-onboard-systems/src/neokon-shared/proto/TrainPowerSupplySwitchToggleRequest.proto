syntax = "proto3";
package proto;

import "TogglerState.proto";

/**
 * Used to activate/deactivate non-electrified zone.
 */
message TrainPowerSupplySwitchToggleRequest
{
    /**
     * The name of the supply change mark node in Layer_ElectrificationMarks.
     */
    string mark_name = 1;

    TogglerState.State switch_command = 2;
}

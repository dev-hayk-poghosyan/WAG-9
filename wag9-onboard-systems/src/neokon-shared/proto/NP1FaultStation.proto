message ToPanelValues
{
    bool depot_entry = 1;
    bool s28 = 2;
    bool sf64 = 3;
    bool sf65 = 4;
    bool kn45 = 5;
    bool kn46 = 6;
}

message FromPanelValues
{
    oneof value
    {
        bool depot_entry = 1;
        bool s28 = 2;
        bool sf64 = 3;
        bool sf65 = 4;
        bool kn45 = 5;
        bool kn46 = 6;
    }
}

message SectionValues
{

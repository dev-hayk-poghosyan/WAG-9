syntax = "proto3";
package proto.class769.faultstation;
option csharp_namespace = "Class769_FS";

message ToFaultStationMessage
{
    CoachOrDoor coach = 1;
    oneof message
    {
        ToCabinPanels to_cabins_panels = 2;
        EnvironmentCupboard to_environment_cupboard = 3;
        ToTsolEnvironmentCupboard to_tsol_environment_cupboard = 4;
        ToMsoFaultIndicationCupboard to_mso_fault_indication_cupboard = 5;
        ToMsoDiagnosticCupboard to_mso_diagnostic_cupboard = 6;
        bool reset = 7;
        bool side_light_lit = 8;
        Passcomm to_passcomm = 9;
        bool pantograph_lifted = 10;
        ToDoor to_door = 11;
        ToIcadIcvcb to_icad_icvcb = 12;
    }
}

message FromFaultStationMessage
{
    CoachOrDoor coach = 1;
    oneof message
    {
        FromCabinPanels from_cabins_panels = 2;
        FromInternalEmergencyDoor from_internal_emergency_door = 3;
        Passcomm from_passcomm = 4;
        FromIcvrBprv from_icvr_bprv = 5;
        FromPantograph from_pantograph = 6;
        FromDrivingCabIsolationCocks from_driving_cab_isolation_cocks = 7;
        FromIcadIcvcb from_icad_icvcb = 8;
        EnvironmentCupboard from_environment_cupboard = 9;
        FromTsolEnvironmentCupboard from_tsol_environment_cupboard = 10;
        FromMsoFaultIndicationCupboard from_mso_fault_indication_cupboard = 11;
        FromMsoDiagnosticCupboard from_mso_diagnostic_cupboard = 12;
        FromCallAid from_call_aid = 13;
        FromBcuIsolationCocks from_bcu_isolation_cocks = 14;
        FromFireHandle from_fire_handle = 15;
        FromMricIsolationCock from_mric_isolation_cock = 16;
        FromMrpcc from_mrpcc = 17;
    }
}

message ToDoor
{
    CoachOrDoor door = 1;
    bool door_opened = 2;
}


syntax = "proto3";
package proto;

/**
 * Definition for the pneumoPipe pneumatic element.
 * @see PneumoPipeComponent.h
 */
message PneumoPipeDef
{
    string name = 1;
    string connected_reservoir1_name = 2;
    string connected_reservoir2_name = 3;
}

/**
 * Definition of the value to be set from the plugin DLL.
 */
message PneumoPipeSet
{
    bool cock = 1;
}

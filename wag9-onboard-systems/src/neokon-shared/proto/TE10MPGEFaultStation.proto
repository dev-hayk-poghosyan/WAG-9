syntax = "proto3";
package proto.te10mpge.faultstation;
option csharp_namespace = "SchemeFaultStations.TE10MPGE";

message ToFaultStation
{
    Section section = 1;
    oneof message
    {
        ElectricValues electric_values = 2;
        PneumaticValues pneumatic_values = 3;
        ToPanelValues panel_values = 4;
        SectionValues section_values = 5;
        bool reset_fault_station_values = 6;
    }
}

/**
 * Это сообщение-контейнер. Передается из Fault Station в контроллер поезда TrainSim.
 */
message FromFaultStation
{
    Section section = 1;
    FromPanelValues panel_values = 2;
}

enum Section
{
    A = 0;
    B = 1;
}


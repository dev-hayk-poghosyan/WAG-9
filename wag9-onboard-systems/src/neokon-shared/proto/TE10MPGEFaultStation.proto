message ToPanelValues
{
    oneof value
    {
        bool generator_Excitation = 1;  //возбуждение генератора
        bool engine_Operation = 2;  //работа двигателя
        bool main_Control = 3;  //главное управление
        bool fire_Alarm = 4;  //пожарная сигнализация
        bool buffer_Lights = 5;  //буферные огни
        bool box_Heater_Ab = 6;  //обогрев яшиков аб
        bool radioS_tation = 7;  //радиостанция
        bool locomotive_Signaling = 8;  //локомотивная сигнализация
        bool window_Heating = 9;  //обогрев стекол
        bool condensate_Discharge = 10;  //сброс конденсата
        bool front_Searchlight = 11;  //передний прожектор
        bool rear_Projector = 12;  //задний прожектор
        bool diesel_Stop = 13;  //оснановка двигателя
        bool control_Cabinet_Heating = 14;  //обогрев шкафа управления
        bool electromagnetic_Clutch = 15;  //электромагнитная муфта
        bool air_Filter_Fan = 16;  //вентилятор воздушного фильтра
        bool exciter_Field = 17;  //возбуждение возбудителя
        bool auxiliary_Generator = 18;  //вспомогательный генератор
        bool water_Drain = 19;  //слив воды
        bool running_Lights = 20;  //ходовые огни
        bool fuel_Pump = 21;  //топливный насос
        bool local_Control = 22;  //местное управление
        bool battery_And_Computer_Charging = 23;  //зарядка акб и компьютера
        bool control_Switch = 24; //выключатель управления
        bool cabin_Heater = 25; //обогреватель кабины
        bool operator_Side_Heating = 26; //обогрев сторона машиниста
        bool heating_Assistant_Side = 27; //обогрев сторона помогника
    }
}

message FromPanelValues
{
    oneof value
    {
        //возбуждение генератора
        bool generator_excitation = 1;
        //работа двигателя
        bool engine_operation = 2;
        //главное управление
        bool main_control = 3;
        //пожарная сигнализация
        bool fire_alarm = 4;
        //буферные огни
        bool buffer_lights = 5;
        //обогрев яшиков аб
        bool box_heater_ab = 6;
        //радиостанция
        bool radio_station = 7;
        //локомотивная сигнализация
        bool locomotive_signaling = 8;
        //обогрев стекол
        bool window_heating = 9;
        //сброс конденсата
        bool condensate_discharge = 10;
        //передний прожектор
        bool front_searchlight = 11;
        //задний прожектор
        bool rear_projector = 12;
        //оснановка двигателя
        bool diesel_stop = 13;
        //обогрев шкафа управления
        bool control_cabinet_heating = 14;
        //электромагнитная муфта
        bool electromagnetic_clutch = 15;
        //вентилятор воздушного фильтра
        bool air_filter_fan = 16;
        //возбуждение возбудителя
        bool exciter_field = 17;
        //вспомогательный генератор
        bool auxiliary_generator = 18;
        //слив воды
        bool water_drain = 19;
        //ходовые огни
        bool running_lights = 20;
        //топливный насос
        bool fuel_pump = 21;
        //местное управление
        bool local_control = 22;
        //зарядка акб и компьютера
        bool battery_and_computer_charging = 23;
        //управление двигателем
        int32 engine_control = 24;
        //выбор режима
        int32 mode_selection = 25;
        //дизельный отсек
        bool diesel_compartment = 26;
        //проходы
        bool aisles = 27;
        //аппаратная камера
        bool equipment_chamber = 28;
        //подсветка номера
        bool license_plate_light = 29;
        //алсн
        bool alsn = 30;
        //подкузовное освещение
        bool underbody_lighting = 31;
        //выкл тэд 1
        bool off_ted1 = 32;
        //выкл тэд 2
        bool off_ted2 = 33;
        //выкл тэд 3
        bool off_ted3 = 34;
        //выкл тэд 4
        bool off_ted4 = 35;
        //выкл тэд 5
        bool off_ted5 = 36;
        //выкл тэд 6
        bool off_ted6 = 37;
        //выключатель управления
        bool control_switch = 38;
        //обогреватель кабины
        bool cabin_heater = 39;
        //обогрев сторона машиниста
        bool operator_side_heating = 40;
        //обогрев сторона помогника
        bool heating_assistant_side = 41;
        //резервный тумблер
        bool reserve_switch = 42;
        //запуск топливного насоса
        bool fuel_pump_switch = 43;
        //запуск двигателя
        bool engine_run = 44;
        //резервный кнопка
        bool reserve_button = 45;
    }
}

message SectionValues
{
    bool spotlight_lit = 1;
    bool buffer_left_white_lit = 2;
    bool buffer_right_white_lit = 3;
    bool buffer_left_red_lit = 4;
    bool buffer_right_red_lit = 5;
    bool spotlight_lit_back = 6;
    bool buffer_left_white_lit_back = 7;
    bool buffer_right_white_lit_back = 8;
    bool buffer_left_red_lit_back = 9;
    bool buffer_right_red_lit_back = 10;
}

syntax = "proto3";
package proto.tem7a.faultstation;
option csharp_namespace = "SchemeFaultStations.TEM7A";

message ToFaultStation
{
    oneof message
    {
        ElectricValues electric_values = 1;
        ToPanelValues panel_values = 2;
        SectionValues section_values = 3;
        bool reset_fault_station_values = 4;
        PneumaticValues pneumatic_values = 5;
    }
}

/**
 * Это сообщение-контейнер. Передается из Fault Station в контроллер поезда TrainSim.
 */
 message FromFaultStation
 {
     FromPanelValues panel_values = 1;
 }


syntax = "proto3";
package proto;

message BlackBoxRecord
{
    bool pause_state = 1;

    /**
     * This time is ticking even in paused state.
     */
    uint32 simulation_time_ms = 2;

    float route_position_km = 3;

    // САУТ. Система Автоматического Управления Тормозами (Вкл/Выкл).
    bool auto_brake_control_on = 4;
    
    // ВклКом. Состояние Компрессора (Вкл/Выкл).
    bool compressor_active = 5;
    
    // ПАБ. Сигнал наличия полу автоблокировки (Вкл/Выкл).
    bool semi_auto_blocking_on = 6;
    
    // УпрЭПК. Показывает под током ЭПК или нет (Вкл/Выкл).
    bool epv_powered = 7;
    
    // КлЭПК1. Отображает состояние Ключа ЭПК1 (Вкл/Выкл).
    bool epv1_state = 8;
    
    // РукРБ. Отображает состояние Рукоятки РБ (Вкл/Выкл).
    bool rb_btn_state = 9;
    
    // РукРБС. Отображает состояние Рукоятки РБС (Вкл/Выкл).
    bool rbs_btn_state = 10;
    
    // КнВК. Отображает состояние Кнопки ВК (Вкл/Выкл).
    bool vk_btn_state = 11;
    
    // Подтяг - Отображает состояние Кнопки “Подтяг” (Вкл/Выкл).
    bool pull_closer_btn_state = 12;
    
    // КнОтпр - Отображает состояние Кнопки “Отпр.” (Вкл/Выкл).
    bool move_on_red_btn_state = 13;
    
    // КнОС. - Отображает состояние Кнопки “ОС”. (Вкл/Выкл).
    bool speed_limit_cancel_btn_state = 14;
    
    // КнК20 - Отображает состояние Кнопки «К20» (Вкл/Выкл).
    bool red20kmh_btn_state = 15;
    
    // Тифон – Отображает наличие сигнала Тифона (Вкл/Выкл).
    bool typhon_state = 16;
    
    // ЭПТтор - Отображает Наличие режима ЭПТ «Торможение» (Вкл/Выкл).
    bool epb_brake_state = 17;
    
    // ЭПТпер - Отображает Наличие режима ЭПТ «Перекрыша» (Вкл/Выкл).
    bool epb_overlap_state = 18;
    
    // ЭПТцеп - Отображает Наличие режима ЭПТ «Контроль цепи (Вкл/Выкл).
    bool epb_circuit_control_state = 19;
    
    // ЗпСАУТ – Запрет отпуска САУТ (Вкл/Выкл).
    bool auto_brake_control_disengage_blocked = 20;
    
    // АкКЛУБ – Активность КЛУБ (вкл/выкл).
    bool club_device_active = 21;
    
    // НулКон – Отображает состояние рукоятки «Ноль-контроллера»
    // (ненулевое – выкл (тяга) /нулевое – вкл).
    bool null_controller_state = 22;
    
    // Свист. - Отображает наличие сигнала Свисток. (Вкл/Выкл).
    bool whistle_state = 23;
    
    // КОН – отображает состояние КОНа(норм./срыв).
    bool kon_state = 24;
    
    // Светофор - показание локомотивного светофора.
    int32 cabin_signal_color = 25;

    // ТЦ - Давление в тормозных цилиндрах локомотива.
    float pressure_in_brake_cylinders = 26;

    // ТМ - Давление в тормозной магистрали локомотива.
    float pressure_in_brake_line = 27;

    // УР - Давление в уравнительном резервуаре локомотива.
    float pressure_in_equalizing_reservoir = 28;

    // ГР - Давление в главном резервуаре локомотива.
    float pressure_in_main_reservoir = 29;

    // Vлок - Скорость локомотива.
    float speed_kmh = 30;

    // Vогр - Ограничение скорости локомотива.
    float speed_limit_kmh = 31;
}

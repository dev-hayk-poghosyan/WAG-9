syntax = "proto3";
package proto.tem2um.faultstation;

/**
 * For FaultStation applications <noesis-scheme.git branch EvgeniyD\t2um> for TEM2UM and
 * TrainSim <TrainSim.git>, the message format must match.
 *
 * Для приложений FaultStation <noesis-scheme.git branch EvgeniyD\t2um> для ТЭМ2УМ и
 * TrainSim <TrainSim.git> формат сообщений должен совпадать.
 */

/**
 * This message is a container from TrainSim train controller to FaultStation.
 * It has 2 sets of parameters: data for electrical and pneumatic circuits.
 *
 * Это сообщение-контейнер из контроллера поезда TrainSim в FaultStation. В нем 2 набора
 * параметров: данные для электрической и пневматической схем.
 */
message ToFaultStation
{
    ElectricValues electric_values = 1;
    PneumaticValues pneumatic_values = 2;
}


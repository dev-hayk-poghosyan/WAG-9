/**
 * This message is a container. Transmitted from Fault Station to TrainSim train controller.
 * Now here is the answer only from the Fault Station electrical circuit.
 *
 * Это сообщение-контейнер. Передается из Fault Station в контроллер поезда TrainSim.
 * Сейчас здесь ответ только от электрической схемы Fault Station.
 */
message FromFaultStation
{
    oneof fault
    {
        ElectricFaultAnswer electric_fault = 1;
    }
}

/**
 * In this message, the selected action of the driver in response to the included fault.
 * electric_fault - enabled fault
 * answer - the number of the selected answer
 *
 * В это сообщении выбранное действие машиниста в ответ на включенную неисправность.
 * electric_fault - включенная неисправность
 * answer - номер выбранного ответа
 */
message ElectricFaultAnswer
{
    ElectricFaults electric_fault = 1;
    int32 answer = 2;
}

enum ElectricFaults {
    AB1Fault = 0;
    AB2Fault = 1;
    AB3Fault = 2;
    ZeroThrottleFault = 3;
    B27Fault = 4;
    KTNFault = 5;
    RV3OffFaultRV3OnFault = 6;
    RU5Fault = 7;
    RDMFault = 8;
    D2Fault = 9;
    KU17Fault = 10;
    VVFault = 11;
    P1Fault = 12;
    P2Fault = 13;
    KU10Fault = 14;
    ReversorFault = 15;
    KVFault = 16;
    FirstThrottleFault = 17;
    FirstThrottleFault_Copy = 18;
    KVFault_Copy = 19;
}


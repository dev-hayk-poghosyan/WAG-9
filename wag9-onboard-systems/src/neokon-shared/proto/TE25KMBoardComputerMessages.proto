    message Message
    {
        MessageId id = 1;
        int32 number = 2;
        Section section = 3;
    }

    int64 trenager_datetime = 1;
    oneof value
    {
        KeyboardButton keyboard_button = 2;
        SectionParameters section_parameters = 3;
        bool boar_computer_power = 4; // питание бортового компьютера
        Message message = 5;
    }
}

message TcpFromBoardComputerMessage
{
    Section section = 1;
    oneof value
    {
        bool fuel_pumping = 2; // прокачка топлива
        bool oil_pumping = 3; // прокачка масла
        bool power_level = 4; // уровень мощности 0-полный 1-селективный
        bool Selective_targer_power = 5; // заданая мощность
        bool Selective_limit_power = 6; // ограничение мощности
        bool idling = 7; //холостой ход
    }
}

enum Section
{
    A = 0;
    B = 1;
}
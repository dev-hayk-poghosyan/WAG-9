syntax = "proto3";
package proto.te116ud.boardcomputer;

message ToBoardComputerMessage{
    oneof main_value {
        bool display_power = 1;
        KeyboardButton display_keyboard = 2;
        int64 trenager_datetime = 3;
        int32 driving_controller_position = 4;
        int32 speed_Kph = 5;
        float acceleration_ms2 = 6;
        int32 traction_force_ts = 7;
        Reversor reversor = 8;
        WorkingMode working_mode_section_1 = 9;
        WorkingMode working_mode_section_2 = 10;
        Message message = 11;
    }
    oneof section_value {
        SectionParameters section_1 = 12;
        SectionParameters section_2 = 13;
    }
}

message SectionParameters{
    //основной экран
    int32 oil_temperature = 1;
    int32 water_temperature = 2;
    float oil_pressure_kgfcm2 = 3;
    float fuel_pressure = 4;
    int32 battery_charging_current_A = 5;
    bool compressor = 6;
    bool contactor_kh_1 = 7;
    bool contactor_kh_2 = 8;
    //kW
    int32 power_kW = 9;
    //kA
    int32 rectifier_current_A = 10;
    int32 rectifier_voltage_V = 11;
    int32 traction_motors_current_A = 12;
    //Настройки регулятора
    int32 diesel_crankshaft_speed_rpm = 13;
    int32 output_of_the_fuel_rail = 14; //выход рейки ТНВД
    int32 turbine_speed_rpm = 15;
    float charge_air_pressure_kgfcm2 = 16;
    // int32 power_kW = 18;
    bool boost_restriction = 19;
    bool sign_stop = 20;
    bool rpm_stop = 21;
    bool oil_protection = 22;

    // Реле земли
    int32 r_minus_power_circuit_kOhm = 23;
    int32 r_plus_power_circuit_kOhm = 24;
    int32 r_general_power_circuit_kOhm = 25;

    //Вспомогательное оборудование. Параметры
    bool automat_mv11 = 26;
    bool automat_mv12 = 27;
    bool automat_mv13 = 28;
    bool automat_mv14 = 29;
    bool contactor_mv11 = 30;
    bool contactor_mv12 = 31;
    bool contactor_mv13 = 32;
    bool contactor_mv14 = 33;
    float auxiliary_equipment_water_temperature = 34;
    float auxiliary_equipment_oil_temperature = 35;
    int32 compressor_motor_current_A = 36;
    bool rele_sp2 = 37;
    float air_pressure_main_tank_kgcm2 = 38;
    int32 water_level_expansion_tank = 39;

    //Вспомогательное оборудование. Компрессор
    bool btn_compressor = 40;
    bool contactor_km23 = 41;
    bool contactor_km24 = 42;
    bool contactor_rdk = 43;
    int32 time_after_compressor_stop = 44;
    int32 total_compressor_running_time = 45;
    int32 compressor_actuations = 46;

    //Дизель. Параметры дизеля
    float vacuum_turbocharger_inlet_kgfcm2 = 47;//разрежение на входе турбокомпрессора (кгс/см2);
    int32 ambient_air_temperature = 48;
    int32 water_temperature_inlet_charge_air_cooler = 49;
    int32 fuel_temperature = 50;

    //Дизель. Моторесурс
    int32 diesel_total_work_time = 51;
    int32 diesel_total_work_power_MWh = 52;
    repeated float position_percentages = 53; //0-15[16] 0-1.0

    //Дизель. Цилиндры
    int32 gas_temperature_turbine_inlet_left = 54;
    int32 gas_temperature_turbine_inlet_right = 55;
    repeated int32 cylinder_outlet_gas_temperature_left = 56; //0-7[8]
    repeated int32 cylinder_outlet_gas_temperature_right = 57; //0-7[8]

    //Дизель. Масляная система
    float oil_pressure_oil_filter_inlet_kgfcm2 = 58;
    float oil_pressure_diesel_inlet_kgfcm2 = 59;
    int32 oil_temperature_diesel_inlet = 60;
    int32 oil_temperature_diesel_outlet = 61;

    //Дизель. Топливная система
    float pressure_fuel_before_fine_fuel_filter_kgfcm2 = 62;
    float pressure_fuel_after_fine_fuel_filter_kgfcm2 = 63;
    int32 fuel_temperature_diesel_inlet = 64;

    //Электрооборудование. Системы возбуждения
    bool contactor_km10 = 65;
    bool contactor_km11 = 66;
    bool contactor_km13 = 67;
    bool btn_sf10 = 68;
    bool contactor_qs4 = 101;
    int32 generator_voltage_V = 69;
    int32 excitation_current_auxiliary_generator_A = 70;
    int32 excitation_current_A = 71;
    int32 opening_angle_thyristors_geu = 72;

    //Электрооборудование. Силовые цепи
    bool contactor_qf5 = 73;
    bool contactor_qf6 = 74;
    bool contactor_qf7 = 75;
    int32 traction_generator_current_A = 76;
    repeated int32 opening_angle_thyristors_controlled_rectifiers = 77;//0-5[6]

    //Электрооборудование. ТЭД
    bool contactor_kp1 = 78;
    bool contactor_kp2 = 79;
    bool contactor_kp3 = 80;
    bool contactor_kp4 = 81;
    bool contactor_kp5 = 82;
    bool contactor_kp6 = 83;
    bool contactor_kp = 102;
    repeated int32 controlled_rectifier_voltages_V = 84; //0-5[6]
    repeated int32 traction_motor_armature_currents_A = 85; //0-5[6]
    repeated int32 wheelset_speeds = 86; //0-5[6]
    repeated bool fuse_status = 87; //0-5[6]
    int32 current_distribution_percent = 88; //0-100
    int32 excitation_voltage_traction_motors_edt_V = 89;
    int32 motorfan_current_A_1 = 90;
    int32 motorfan_current_A_2 = 91;

    //Электрооборудование. Бортовая сеть
    bool contactor_km21 = 92;
    bool contactor_km22 = 93;
    int32 cranking_current_diesel_A = 94;
    int32 battery_voltage_V = 95;
    int32 onboard_voltage_V = 96;
    int32 battery_capacity_percent = 97; //0-100

    int32 working_mode_timer = 98;

    bool link_utp = 99;
    bool link_sud = 100;
}

message Message{
    MessageId id = 1;
    int32 number = 2;
    bool b_section = 3;
}

message FromBoardComputerMessage{
    bool section = 5; // Секция false - first true - second
    oneof value{
        bool power_level_full = 1; // уровень мащности false - селективный true - полный
        int32 power_change_kW = 2; // изменение мощности
        bool ground_relay_minus = 3; // реле земли - вкл/выкл
        bool ground_relay_plus = 4; // реле земли + вкл/выкл
    }
}

enum Reversor{
    Neutral = 0;
    Forvard = 1;
    Back = 2;
}

enum WorkingMode{
    //Стоп
    Stop = 0;
    //Прокачка
    Pump = 1;
    //Прокрутка
    Scrolling = 2;
    //Остановка
    Stopping = 3;
    //Холостой ход
    Idling = 4;
    //Тяга
    Traction = 5;
    //Эдт
    Edt = 6;
    //Выбег
    Runout = 7;
    //Замещение
    Replacing = 8;
}


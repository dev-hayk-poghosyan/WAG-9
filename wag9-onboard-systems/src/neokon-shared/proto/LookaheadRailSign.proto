syntax = "proto3";
package proto;

import "RailSignType.proto";

message LookaheadRailSign
{
    /**
     * Position in meters relative to the train head's position.
     * Negative positions are valid and indicate the object is behind the train's head.
     */
    float train_relative_position_m = 1;

    RailSignType sign_type = 2;
}

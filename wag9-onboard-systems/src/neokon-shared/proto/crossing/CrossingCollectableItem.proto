syntax = "proto3";
package proto;

import "CrossingCollectableItemCategory.proto";
import "CrossingHandAction.proto";

/**
 * A record in the "collectableItems.json" file. 
 */
message CrossingCollectableItem
{
    /**
     * UUID of a object in world you can click to put this item into inventory. 
     */
    string world_item_uuid = 1;

    /**
     * UUID of this item in the inventory. 
     */
    string uuid  = 2;
    string title = 3;
    CrossingCollectableItemCategory category = 4;
    string image = 5;
    string highlighted_image = 6;

    string hand_icon_image = 7;
    repeated string states_activated_when_taken_in_hand = 8;
    repeated string states_deactivated_when_taken_in_hand = 9;
    repeated string states_activated_when_removed_from_hand = 10;
    repeated string states_deactivated_when_removed_from_hand = 11;
    repeated CrossingHandAction hand_actions = 12;

    bool right_handed = 13;
}

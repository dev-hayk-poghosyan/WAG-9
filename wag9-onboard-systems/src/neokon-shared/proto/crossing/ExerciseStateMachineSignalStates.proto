syntax = "proto3";
package proto;

message ExerciseStateMachineSignalStates
{
    /**
     * Node name to search in the world. Should be unique.
     */
    string signal_node_name = 1;

    /**
     * If this expression is satisfied, the signal is enabled. If it's empty, the signal is always
     * enabled.
     */
    string enabled_expression = 2;

    /**
     * The signals can be changed externally so additionally activate or deactivate states when
     * that happens. The states are not applied when the signal changes its state due to
     * changes in the state machine states.
     */
    repeated string activate_states_when_enabled = 3;

    repeated string deactivate_states_when_enabled = 4;

    repeated string activate_states_when_disabled = 5;

    repeated string deactivate_states_when_disabled = 6;
}

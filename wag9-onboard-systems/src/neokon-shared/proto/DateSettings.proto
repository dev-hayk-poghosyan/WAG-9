syntax = "proto3";
package proto;

message DateSettings
{
    /**
     * The day of year, starting from 0.
     *
     * Non-leap years are assumed, so the valid range is [0, 364].
     */
    uint32 day_of_year = 1;

    /**
     * The time of day is specified in Scenario.proto, while this
     * value serves as a signed offset to it.
     */
    int32 time_of_day_offset_sec = 2;

    /**
     * The simulation time in nanoseconds.
     * Should be used in all newer scenarios, previous fields are deprecated.
     */
    optional uint64 sim_time_ns = 3;
}

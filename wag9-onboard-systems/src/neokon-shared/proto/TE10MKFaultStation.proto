syntax = "proto3";
package proto.te10mk.faultstation;
option csharp_namespace = "SchemeFaultStations.TE10MK";

/**
 * Это сообщение-контейнер. Передается в Fault Station из контроллера поезда TrainSim.
 */
 message ToFaultStation
{
    Section section = 1;
    oneof message
    {
        ElectricValues electric_values = 2;
        PneumaticValues pneumatic_values = 3;
        SectionValues section_values = 5;
        bool reset_fault_station_values = 6;
    }
}

/**
 * FaultStation заточен под показ только 2 секций.
 * Если использовать текуший для 3ТЭ10Мк то пропускать буферную секцию.
 */
enum Section
{
    A = 0;
    B = 1;
}


syntax = "proto3";
package proto.class170.fs;

import "LeftRightSide.proto";
import "VehicleEndpoint.proto";

/**
 * Cars(vehicles) of class 170.
 */
enum VehicleItem
{
    /**
     * Driving Motor Standard Lavatory (DMSL 50xxx)
     */
    DMSL = 0;

    /**
     * Motor Standard (MS 56xxx)
     */
    MS   = 1;

    /**
     * Driving Motor Car Lavatory (DMCL 79xxx)
     */
    DMCL = 2;
}

enum ChargeSocketSwitch
{
    AUX_START_BATT = 0;
    AUX_BATT       = 1;
    ISOLATE        = 2;
    START_BATT     = 3;
}

/**
 * A message is processed on the Faul Station side.
 */
message FaultStationIncomingMessage
{
    /**
     * The Id assigned to the vehicle.
     * This identifies the specific vehicle.
     * Every message MUST contain this info.
     */
    string vehicle_id = 1;

    /**
     * Which part of the train does this message belongs to.
     * Identical control block or information panels may be located at different ends of the vehicle.
     * For example, the front and tail doors. This field indicates that place. Head or Tail.
     * Every message MUST contain this info.
     */
    VehicleEndpoint.Endpoint endpoint = 2;

    /**
     * The side of the carriage on which the control panel is located,
     * to which this message is addressed.
     * Every message MUST contain this info.
     */
    LeftRightSide.Side side = 3;
    
    oneof message
    {
        VehicleCommand vehicle_command = 4;
        Bogie bogie  = 5;
        Door  door = 6;

        bool fuel_tank_empty   = 7;

        /**
         * Value from [-1..12] expected. 0 - green, 1,2,3 - red, [4..12]-yellow. -1 - no lamps.
         */
        int32 engine_coolant_kroma_gauge = 8;

        BodyEndCupboardLamps body_end_cupboard_lamps = 9;

        /**
         * If true this vehicle is currently controlled by the driver.
         */
        bool controlled_by_driver = 10;

        bool mcb_panel_couple_test_lamp = 11;

        /**
         * State of the blue lamp(DOOR CLOSE) on all door control panels(DCP) of a train.
         */
        bool dcp_entire_train_close_lamp = 12;

        bool sand_system_box_empty = 13;

        bool side_lights_on = 14;

        bool force_close_all_doors = 15;
        
        /**
        * Contains the vehicle’s type.
        * Sent only once during first-time setup.
        */
        VehicleItem vehicle_item = 16;
    }
}

/**
 * A message generated by FS. As with FaultStationIncomingMessage, always contain information
 * about the sender. The end of the vehicle, the side of the vehicle, and the specific vehicle.
 * This message is generated and sent every time any control element is changed by the user.
 */
message FaultStationOutgoingMessage
{
    /**
     * The Id assigned to the vehicle.
     * This identifies the specific vehicle.
     * Every message contain this info.
     */
    string vehicle_id = 1;

    /**
     * Which part of the train does this message belongs to.
     * Identical control block or information panels may be located at different ends of the vehicle.
     * For example, the front and tail doors. This field indicates that place. Head or Tail.
     * Every message contains this info.
     */
    VehicleEndpoint.Endpoint endpoint = 2;

    /**
     * The side of the carriage on which the control panel is located,
     * from which this message is sent.
     */
    LeftRightSide.Side side = 3;

    /**
     * The payload of the message. Contains information about changes in the control elements.
     */
    VehicleCommand command = 4;
}

/**
 * Describes the condition of a particular door in the vehicle.
 */
message Door
{
    bool external_door_ctrl_halo = 1;

    /**
     * Lamp states from the Door Control panel(DCP). True - light is on;
     */
    bool dcp_deselect_lamp  = 2;
    bool dcp_release_1_lamp = 3;
    bool dcp_release_2_lamp = 4;
    bool dcp_signal_lamp    = 5;
    bool dcp_power_lamp     = 6;

    /**
     * Lamp states from the Passenger Doors - Internal Control(DCP). True - light is on;
     */
    bool idc_close_left_halo  = 7;
    bool idc_close_right_halo = 8;
    bool idc_open_left_halo   = 9;
    bool idc_open_right_halo  = 10;
}

/**
 * Describes the condition of a particular bogie in the vehicle.
 */
message Bogie
{
    enum AxleState
    {
        AXLE_NORMAL = 0;
        AXLE_DRAGGING = 1;
    }
    enum BrakeState
    {
        BRAKE_NORMAL = 0;
        BRAKE_DRAGGING = 1;
    }
    enum SuspensionState
    {
        SUSPENSION_NORMAL = 0;
        SUSPENSION_DEFLATED = 1;
    }

    SuspensionState secondary_suspension = 1;

    /**
     * The first bogie in the along of movement
     */
    AxleState  head_axle_box   = 2;
    BrakeState head_brake_pads = 3;

    /**
     * The last bogie in the along of movement
     */
    AxleState  tail_axle_box   = 4;
    BrakeState tail_brake_pads = 5;
}

message BodyEndCupboardLamps
{
    bool dragging_brake_lamp = 1;
    bool parking_brake_lamp = 2;
    bool transmission_fault_lamp = 3;
    bool aux_heater_lamp = 4;
    bool fire_alarm_interlock_lamp = 5;
    bool door_system_fault_lamp = 6;
    bool otmr_fault_lamp = 7;
    bool engine_fault_lamp = 8;

    bool generator_supply_fault_lamp = 9;
    bool wsp_fault_lamp = 10;
    bool hvac_fault_lamp = 11;

    bool hydrostatic_isolation_lamp = 12;
    bool toilet_fault_lamp = 13;
    bool local_fault_lamp = 14;
}

message BodyEndCupboard
{
    bool charging_fault_isolation_button = 1;
    bool wsp_fault_isolation_button = 2;
    bool local_control_switch = 3;
    bool engine_control_1_switch = 4;
    bool engine_control_2_switch = 5;
    bool engine_starting_switch = 6;
    bool wsp_switch = 7;
    bool door_supply_1_switch = 8;
    bool door_supply_2_switch = 9;
    bool gangway_switch = 10;
    bool toilet_switch = 11;
    bool passenger_ctg_switch = 12;
    bool passenger_info_switch = 13;
    bool phone_switch = 14;
    bool main_lighting_1_switch = 15;
    bool main_lighting_2_switch = 16;
    bool engine_preheat_switch = 17;
    bool aux_heating_switch = 18;
    bool saloon_heating_1_switch = 19;
    bool saloon_heating_2_switch = 20;
    bool air_con_1_switch = 21;
    bool air_con_2_switch = 22;
    bool air_con_12_cab_duct_switch = 23;
    bool air_con_13_cab_duct_switch = 24;
    bool hand_dryer_switch = 25;
    bool water_heater_switch = 26;

    bool air_cond_extract_fans_switch = 27;
    bool air_cond_m1_compressor_1_switch = 28;
    bool air_cond_m1_compressor_2_switch = 29;
    bool air_cond_m1_condenser_fan_switch = 30;
    bool air_cond_m1_heaters_switch = 31;

    bool air_cond_m2_compressor_1_switch = 32;
    bool air_cond_m2_compressor_2_switch = 33;
    bool air_cond_m2_condenser_fan_switch = 34;
    bool air_cond_m2_heaters_switch = 35;

    bool wfcb_switch = 36;

    /**
     * MS Vehicle only related buttons.
     */
    bool ms_brake_control = 37;
    bool ms_door_control = 38;
    bool ms_fault_protec = 39;
    bool ms_public_address = 40;
    bool ms_emerg_ltg = 41;
    bool ms_fire_alarm_isolating = 42;
    bool ms_fire_alarm_test = 43;
}

message BrakeRaft
{
    bool cylinder_1_closed           = 1;
    bool cylinder_2_closed           = 2;
    bool air_suspension_1_closed     = 3;
    bool air_suspension_2_closed     = 4;
    bool main_reservior_closed       = 5;
    bool local_main_reservior_closed = 6;
    bool compressor_closed           = 7;
}

message LocalEngineControl
{
    bool local_switch = 1;
    bool start  = 2;
    bool stop   = 3;
}

message CircuitBrakers
{
    /**
     * States of automat_ons on MCB panel.
     * <true> means that automat_on is ON.
    */
    bool automat_wiper1         = 1;
    bool automat_wiper2         = 2;
    bool automat_brake_control  = 3;
    bool automat_fault_protect  = 4;
    bool automat_radio2         = 5;
    bool automat_public_address = 6;
    bool automat_door_control   = 7;
    bool automat_aws            = 8;
    bool automat_train_control  = 9;
    bool automat_tca            = 10;
    bool automat_gsmr           = 11;
    bool automat_cab_aux1       = 12;
    bool automat_cab_aux2       = 13;
    bool automat_earth          = 14;
    bool automat_emerg_lights   = 15;
    bool automat_end_lights2    = 16;
    bool automat_end_lights1    = 17;
    bool automat_lh_screen      = 18;
    bool automat_rh_screen      = 19;
    bool automat_wps            = 20;
    bool tca_isolation          = 21;

    bool couple_test            = 22;
}

message SafetySystemIsolationSwitches
{
    bool aws_isolated = 1;
    bool dsd_isolated = 2;
    bool vigilance_isolated = 3;
    bool traction_interlock_isolated = 4;
    bool pass_com_isolated = 5;
    bool dra_isolated = 6;
    bool emerg_brake_supply_isolated = 7;
    bool fire_alarm_isolated = 8;
}

message PneumaticManifold
{
    bool spb_cock = 1;
    bool horns_cock = 2;
    bool uncoupler_cock = 3;
    bool wash_wire_cock= 4;
}

/**
 * A compound message that contains information about the states of switches, buttons,
 * and all elements that the user can manipulate.
 */
message VehicleCommand
{
    oneof commands
    {
        /**
         * False - closed state. True - opened state.
         */
        bool main_reservoir_pipe_isolating_cock = 1;

        /**
         * False - closed state. True - opened state.
         */
        bool sand_system_isolating_cock = 2;

        bool sand_system_test_button_pressed = 3;

        /**
         * False - closed state. True - opened state.
         */
        bool suspension_surge_tanks_1 = 4;
        bool suspension_surge_tanks_2 = 5;


        bool external_door_ctrl_head_left  = 6;
        bool external_door_ctrl_head_right = 7;
        bool external_door_ctrl_tail_left  = 8;
        bool external_door_ctrl_tail_right = 9;

        /**
         * False - closed state. True - opened state.
         */
        bool passenger_door_emergency_handle_left = 10;
        bool passenger_door_emergency_handle_right = 11;

        bool engine_fuel_supply_isolating_cock_closed = 12;

        LocalEngineControl local_engine_control = 13;

        bool manual_fire_pulled = 14;

        BrakeRaft brake_raft = 15;

        ChargeSocketSwitch charge_socket_switch = 16;

        /**
         * False - closed state. True - opened state.
         */
        bool emergency_coupler_cock_ahead = 17;
        bool main_reservoir_pipe_cock_ahead = 18;

        bool cab_door_eggress_handle = 19;

        bool engine_coolant_kroma_button_pressed = 20;

        bool engine_stop_button_pressed = 21;

        bool heater_fuel_supply_isolating_cock = 22;

        bool brake_isolation_cock = 23;
        bool parking_brake_application_cock = 24;

        bool pa_handset_picked_up = 25;

        bool pass_comm_pressed = 26;

        bool fire_alarm_reset_pressed = 27;

        bool gangway_door_isolation_cock_closed = 28;

        bool toilet_door_isolation_cock_closed = 29;

        BodyEndCupboard body_end_cupboard = 30;

        bool door_deselect_pressed = 31;

        // True - LOCAL, False-Close;
        bool door_close_local = 32;

        bool door_release_1_pressed = 33;
        bool door_release_2_pressed = 34;
        bool door_signal_preseed    = 35;
        bool door_close_preseed     = 36;

        // True - key in horizontal position
        bool door_control = 37;

        /**
         * Values in [0..70] expected.
         */
        int32 parking_brake_manometer = 38;

        /**
         * Passenger Internal Door Control(IDC)
         */
        bool idc_egress_handle = 39;
        bool idc_isolator = 40;
        bool idc_toggler = 41;
        bool idc_alarm_button = 42;

        bool idc_close_left_button_pressed = 43;
        bool idc_close_right_button_pressed = 44;
        bool idc_open_left_button_pressed = 45;
        bool idc_open_right_button_pressed = 46;

        bool baterry_charging_socket_1_opened = 47;
        bool baterry_charging_socket_2_opened = 48;

        CircuitBrakers circuit_brakers = 49;

        SafetySystemIsolationSwitches iso_switches = 50;

        PneumaticManifold pneumatic = 51;
    }
}
